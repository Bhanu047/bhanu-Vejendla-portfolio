name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # No dependencies: the check uses only the standard library, so CI
      # cannot fail because a package index was slow.
      - name: Check the page
        run: python scripts/check_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test tools
        run: npm install --no-save --ignore-scripts playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check responsive layout and interactions
        run: node scripts/check_browser.cjs

